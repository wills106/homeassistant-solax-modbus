name: CI/CD Integrated

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  mypy:
    name: Type Check (mypy)
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run mypy type checking
        run: |
          echo "Running mypy in strict mode..."
          uv run mypy custom_components/solax_modbus tests --strict

  hacs:
    name: HACS Validation
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest Validation
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Hassfest Action
        uses: home-assistant/actions/hassfest@master

  test-quick:
    name: Test Quick
    needs: [mypy]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Quick Tests
        run: uv run pytest -m "not slow"

  test-comprehensive:
    name: Test Minimum Supported HA
    needs: [mypy]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Select minimum Home Assistant and Python
        id: minimum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "MINIMUM_ENV=$RUNNER_TEMP/ha-minimum-env" >> "$GITHUB_ENV"
          echo "MINIMUM_RECORD=$RUNNER_TEMP/ha-minimum-record" >> "$GITHUB_ENV"
          python3 scripts/resolve_current_ha.py --target minimum --output-dir "$RUNNER_TEMP/ha-minimum-record"

      - name: Resolve and install minimum environment
        env:
          MINIMUM_PYTHON: ${{ steps.minimum.outputs.python }}
        run: |
          if [[ "$MINIMUM_PYTHON" =~ ^3\.[0-9]+$ ]]; then
            uv python install --upgrade --no-bin "$MINIMUM_PYTHON"
          else
            uv python install --no-bin "$MINIMUM_PYTHON"
          fi
          uv venv --managed-python --python "$MINIMUM_PYTHON" "$MINIMUM_ENV"
          if ! uv pip compile --no-config --python "$MINIMUM_ENV/bin/python" --upgrade "$MINIMUM_RECORD/requirements.in" -o "$MINIMUM_RECORD/requirements.txt"; then
            echo "::error::Cannot resolve test dependencies for the exact minimum HA declared in hacs.json; no other HA version is substituted."
            exit 1
          fi
          uv pip sync --no-config --python "$MINIMUM_ENV/bin/python" "$MINIMUM_RECORD/requirements.txt"

      - name: Verify and record installed versions
        env:
          EXPECTED_HA: ${{ steps.minimum.outputs.homeassistant }}
          EXPECTED_PYTHON: ${{ steps.minimum.outputs.python }}
        run: |
          "$MINIMUM_ENV/bin/python" - <<'PY'
          import json
          import os
          import platform
          from importlib.metadata import version
          from pathlib import Path

          versions = {
              "python": platform.python_version(),
              "homeassistant": version("homeassistant"),
              "test_plugin": version("pytest-homeassistant-custom-component"),
          }
          Path(os.environ["MINIMUM_RECORD"], "installed.json").write_text(json.dumps(versions, indent=2) + "\n")
          print(json.dumps(versions, indent=2))
          assert versions["homeassistant"] == os.environ["EXPECTED_HA"]
          expected = os.environ["EXPECTED_PYTHON"].split(".")
          assert versions["python"].split(".")[:len(expected)] == expected
          PY
          uv pip freeze --python "$MINIMUM_ENV/bin/python" > "$MINIMUM_RECORD/installed-requirements.txt"
          uv --version > "$MINIMUM_RECORD/uv-version.txt"

      - name: Run Full Tests
        run: '"$MINIMUM_ENV/bin/python" -m pytest'

      - name: Upload minimum environment record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: minimum-ha-environment
          path: ${{ runner.temp }}/ha-minimum-record

  test-current:
    name: Test Current Stable HA
    needs: [mypy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Select stable Home Assistant and Python
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "CURRENT_ENV=$RUNNER_TEMP/ha-current-env" >> "$GITHUB_ENV"
          echo "CURRENT_RECORD=$RUNNER_TEMP/ha-current-record" >> "$GITHUB_ENV"
          python3 scripts/resolve_current_ha.py --output-dir "$RUNNER_TEMP/ha-current-record"

      - name: Resolve and install current environment
        env:
          CURRENT_PYTHON: ${{ steps.current.outputs.python }}
        run: |
          uv venv --python "$CURRENT_PYTHON" "$CURRENT_ENV"
          if ! uv pip compile --no-config --python "$CURRENT_ENV/bin/python" --upgrade "$CURRENT_RECORD/requirements.in" -o "$CURRENT_RECORD/requirements.txt"; then
            echo "::error::Cannot resolve test dependencies for the selected stable HA. A matching test plugin may not be published yet; no older HA fallback is used."
            exit 1
          fi
          uv pip sync --no-config --python "$CURRENT_ENV/bin/python" "$CURRENT_RECORD/requirements.txt"

      - name: Verify and record installed versions
        env:
          EXPECTED_HA: ${{ steps.current.outputs.homeassistant }}
          EXPECTED_PYTHON: ${{ steps.current.outputs.python }}
        run: |
          "$CURRENT_ENV/bin/python" - <<'PY'
          import json
          import os
          import platform
          from importlib.metadata import version
          from pathlib import Path

          versions = {
              "python": platform.python_version(),
              "homeassistant": version("homeassistant"),
              "test_plugin": version("pytest-homeassistant-custom-component"),
          }
          Path(os.environ["CURRENT_RECORD"], "installed.json").write_text(json.dumps(versions, indent=2) + "\n")
          print(json.dumps(versions, indent=2))
          assert versions["homeassistant"] == os.environ["EXPECTED_HA"]
          assert versions["python"] == os.environ["EXPECTED_PYTHON"]
          PY
          uv pip freeze --python "$CURRENT_ENV/bin/python" > "$CURRENT_RECORD/installed-requirements.txt"
          uv --version > "$CURRENT_RECORD/uv-version.txt"

      - name: Test against current stable HA
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" != "refs/heads/main" ]]; then
            "$CURRENT_ENV/bin/python" -m pytest -m "not slow"
          else
            "$CURRENT_ENV/bin/python" -m pytest
          fi

      - name: Upload current environment record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: current-ha-environment
          path: ${{ runner.temp }}/ha-current-record

  all-checks-passed:
    name: ✅ All Checks Passed
    if: always()
    needs: [hacs, hassfest, test-quick, test-comprehensive, test-current]
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          HACS="${{ needs.hacs.result }}"
          HASSFEST="${{ needs.hassfest.result }}"
          QUICK="${{ needs.test-quick.result }}"
          COMPREHENSIVE="${{ needs.test-comprehensive.result }}"
          CURRENT="${{ needs.test-current.result }}"
          
          echo "HACS: $HACS"
          echo "Hassfest: $HASSFEST"
          echo "Quick Tests: $QUICK"
          echo "Comprehensive Tests: $COMPREHENSIVE"
          echo "Current HA Tests: $CURRENT"
          
          # 1. Static Analysis must pass
          if [[ "$HACS" != "success" ]]; then
            echo "❌ HACS validation failed"
            exit 1
          fi
          if [[ "$HASSFEST" != "success" ]]; then
            echo "❌ Hassfest validation failed"
            exit 1
          fi
          if [[ "$CURRENT" != "success" ]]; then
            echo "❌ Current stable HA tests failed or were skipped"
            exit 1
          fi
          
          # 2. Tests: One path must succeed
          if [[ "$COMPREHENSIVE" == "success" ]]; then
            echo "✅ Comprehensive tests passed"
            exit 0
          elif [[ "$QUICK" == "success" && "$COMPREHENSIVE" == "skipped" ]]; then
            echo "✅ Quick tests passed"
            exit 0
          elif [[ "$QUICK" == "skipped" && "$COMPREHENSIVE" == "skipped" ]]; then
            echo "⚠️ No tests ran?"
            exit 1
          else
            echo "❌ Tests failed or cancelled"
            exit 1
          fi
